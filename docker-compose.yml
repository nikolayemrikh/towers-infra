services:
  nginx-proxy:
    image: nginx
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - towers-network

  peerjs:
    image: peerjs/peerjs-server
    container_name: peerjs
    command: ["--port", "9000", "--path", "/"]
    ports:
      - "9000:9000"
    networks:
      - towers-network

  turn:
    image: coturn/coturn:4.18
    container_name: turn
    restart: always
    network_mode: host
    user: root
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
    tmpfs:
      - /var/lib/coturn
    command:
      - "-n" # ignore any turnserver.conf shipped in the image
      - "--no-cli"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=mag-towers.xyz"
      - "--server-name=mag-towers.xyz"
      - "--user=${TURN_USERNAME:?TURN_USERNAME is not set}:${TURN_PASSWORD:?TURN_PASSWORD is not set}"
      - "--listening-ip=${SERVER_PRIVATE_IP:?SERVER_PRIVATE_IP is not set}"
      - "--relay-ip=${SERVER_PRIVATE_IP}"
      - "--external-ip=${SERVER_IP:?SERVER_IP is not set}/${SERVER_PRIVATE_IP}"
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--no-multicast-peers"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=::1"
      - "--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff"
      - "--cert=/etc/letsencrypt/live/turn.mag-towers.xyz/fullchain.pem"
      - "--pkey=/etc/letsencrypt/live/turn.mag-towers.xyz/privkey.pem"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - towers-network

  # calls-telegram-bot:
  #   image: redishko/calls-telegram-bot:latest
  #   container_name: calls-telegram-bot
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - towers-network
  #   # environment:
  #   #   - ALLOWED_ORIGIN=https://app.mag-towers.xyz

  calls-app:
    image: redishko/calls-app:latest
    container_name: calls-app
    restart: always
    ports:
      - "8080:8080"
    networks:
      - towers-network

networks:
  towers-network:
    driver: bridge
