name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy `docker-compose.yml` to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: "~/towers"
          overwrite: true

      - name: SSH to Server and Deploy
        env:
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/towers
            cd ~/towers
            umask 077
            printf 'TURN_USERNAME=%s\nTURN_PASSWORD=%s\nSERVER_IP=%s\nSERVER_PRIVATE_IP=%s\n' '${{ secrets.TURN_USERNAME }}' '${{ secrets.TURN_PASSWORD }}' '${{ secrets.SERVER_IP }}' '${{ secrets.SERVER_PRIVATE_IP }}' > .env
            # echo ${{ secrets.DOCKER_ACCESS_TOKEN }} | docker login -u $DOCKER_USERNAME --password-stdin
            docker compose pull
            docker compose up -d --force-recreate
            # coturn and nginx don't pick up certificates renewed by certbot on their own
            (crontab -l 2>/dev/null | grep -v '# towers-cert-reload'; echo '0 4 * * * docker kill -s USR2 turn >/dev/null 2>&1; docker exec nginx-proxy nginx -s reload >/dev/null 2>&1 # towers-cert-reload') | crontab -
